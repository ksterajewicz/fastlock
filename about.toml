# Configuration of cargo-about, which writes THIRD-PARTY-LICENSES: the
# licenses and authors of every library compiled into fastlock.
#
#   cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES
#
# `accepted` lists only licenses that can be combined into a program under
# GPL-3.0-or-later. A dependency under any other license makes the command
# fail. The order is the preference when a library offers a choice.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "BSD-1-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "bzip2-1.0.6",
    "LGPL-2.1-or-later",
]

# fastlock is built for these systems.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Build scripts and tests are not part of the program.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The crates of this workspace are fastlock itself.
private = { ignore = true }

# zstd-sys is MIT OR Apache-2.0, but it compiles the C sources of Zstandard,
# which are under their own BSD-3-Clause license (or GPL-2.0, not used here).
[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

[[zstd-sys.clarify.files]]
path = "zstd/LICENSE"
license = "BSD-3-Clause"
checksum = "7055266497633c9025b777c78eb7235af13922117480ed5c674677adc381c9d8"
